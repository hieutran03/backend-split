# Local development infrastructure. The AI Engine is NOT here: the in-process mock is used
# by default (AI_ENGINE_MODE=mock). Point AI_ENGINE_MODE=http at the real Python Engine when available.
# Postgres holds the BACKEND's own database only; the Engine has a separate one (docs/integration.md).
# Redis is also the integration event bus (streams bus:backend:events / bus:engine:events).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chatbot']
      interval: 5s
      retries: 10

  redis:
    # 7.4 + AOF like the Python Redis: the outbox relay calls WAITAOF (Redis >= 7.2, needs
    # appendonly) before marking an event published (docs/integration.md §6.1).
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports: ['6379:6379']
    volumes: [redisdata:/data]

  minio:
    image: quay.io/minio/aistor/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]

volumes:
  pgdata:
  redisdata:
  miniodata:
