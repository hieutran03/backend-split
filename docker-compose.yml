# Local development infrastructure. The AI Engine is NOT here: the in-process mock is used
# by default (AI_ENGINE_MODE=mock). Point AI_ENGINE_MODE=http at the real Python Engine when available.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chatbot']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  minio:
    image: quay.io/minio/aistor/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
